packages:
  - 'api'
  - 'worker'
  - 'shared'
  - 'lambdas/*'
overrides:
  fast-xml-parser: '>=5.3.5'
  'glob@>=9.0.0 <14.0.2': '14.0.4'
  'minimatch@>=7.0.0 <11.0.1': '11.0.5'
allowBuilds:
  esbuild: true
  protobufjs: true
minimumReleaseAgeExclude:
  - brace-expansion@5.0.13
  - minimatch@11.0.8
  - prettier@3.10.0
  - vite@8.3.8
